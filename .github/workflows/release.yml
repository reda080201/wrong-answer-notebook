name: Release Windows

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example app-v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run version:check
      - name: Verify signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY secret is required.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is required.' }
      - name: Verify tag version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -ne "app-v$version") { throw "tag $tag does not match app-v$version" }
          git ls-remote --exit-code origin "refs/tags/$tag" | Out-Null
          git fetch origin main --depth=1
          $tagCommit = (git rev-parse HEAD).Trim()
          $mainCommit = (git rev-parse origin/main).Trim()
          if ($tagCommit -ne $mainCommit) { throw "release tag must point at origin/main ($mainCommit), got $tagCommit" }
      - name: Read release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $path = "releases/v$version.md"
          if (!(Test-Path $path)) { throw "release notes missing: $path" }
          $body = Get-Content $path -Raw
          if ([string]::IsNullOrWhiteSpace($body)) { throw "release notes empty: $path" }
          "body<<RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT
      - run: npm run lint
      - run: npm run check:debug
      - run: npm run check:mcp-contract
      - run: npm run check:tauri-contract
      - run: npm run test
      - run: npm run build
      - run: npm run test:e2e
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      - name: Tauri compile smoke
        run: npm run tauri -- build --no-bundle
      - name: Publish signed Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "오답노트 v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
      - name: Verify updater manifest
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "app-v$version"
          $release = gh release view $tag --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if (-not $release.isDraft -or $release.isPrerelease) { throw "release must remain a non-prerelease draft during verification" }
          $dir = Join-Path $env:RUNNER_TEMP 'updater-manifest'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download $tag --pattern latest.json --dir $dir --clobber
          $manifest = Get-Content (Join-Path $dir 'latest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) { throw "latest.json version mismatch" }
          if ([string]::IsNullOrWhiteSpace($manifest.notes)) { throw 'latest.json notes is empty' }
          $platform = $manifest.platforms.'windows-x86_64'
          if ($null -eq $platform -or [string]::IsNullOrWhiteSpace($platform.url) -or [string]::IsNullOrWhiteSpace($platform.signature)) { throw 'windows-x86_64 URL/signature missing' }
          $updaterAsset = @($release.assets | Where-Object { $_.apiUrl -eq $platform.url } | Select-Object -First 1)
          if (!$updaterAsset) { throw "manifest URL does not identify a release asset: $($platform.url)" }
          $assetName = $updaterAsset.name
          if ($assetName -notmatch '-setup\.exe$') { throw "updater asset is not an NSIS installer: $assetName" }
          $signatureAsset = @($release.assets | Where-Object { $_.name -eq "$assetName.sig" } | Select-Object -First 1)
          if (!$signatureAsset) { throw "updater signature is missing for $assetName" }
          $requiredAssets = @(
            $assetName,
            $signatureAsset.name
          )
          gh release download $tag --pattern $assetName --pattern $signatureAsset.name --dir $dir --clobber
          foreach ($filename in $requiredAssets) {
            $path = Join-Path $dir $filename
            if (!(Test-Path -LiteralPath $path)) { throw "verified asset is missing after download: $filename" }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "verified asset is empty: $filename" }
            $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
            if ([string]::IsNullOrWhiteSpace($sha256)) { throw "SHA-256 could not be calculated: $filename" }
            Write-Host "verified $filename size=$((Get-Item -LiteralPath $path).Length) sha256=$sha256"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified release
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release edit "app-v$version" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

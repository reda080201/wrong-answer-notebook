name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  diagrams:
    name: Python diagram pipeline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/diagram_pipeline/requirements.lock
      - name: Install locked Windows wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/diagram_pipeline/requirements.lock
      - name: Static analysis
        run: python -m ruff check tools/diagram_pipeline
      - name: Diagram and security regression tests
        run: python -m pytest tools/diagram_pipeline/tests
      - name: Generate actual PNG example and import ZIP
        shell: pwsh
        run: |
          python -m tools.diagram_pipeline.examples.create_demo --out-dir build/diagram-pipeline/ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.diagram_pipeline render --manifest build/diagram-pipeline/ci/inspected/reviewed.json --out-dir build/diagram-pipeline/ci/rendered
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.diagram_pipeline package --manifest build/diagram-pipeline/ci/rendered/manifest.json --output build/diagram-pipeline/ci/import-v2.zip
          exit $LASTEXITCODE
      - name: Generate vision job without a hand-written manifest
        shell: pwsh
        run: |
          python -m tools.diagram_pipeline.examples.create_vision_demo --out-dir build/vision-demo/input
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.diagram_pipeline run-vision --job build/vision-demo/input/vision-job.zip --out-dir build/vision-demo/output
          exit $LASTEXITCODE
      - name: Generate and package synthetic 30-question 8-figure original-only job
        shell: pwsh
        run: |
          python -m tools.diagram_pipeline.examples.create_vision_30x8_demo --out-dir build/vision-30x8/input
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.diagram_pipeline run-vision --job build/vision-30x8/input/vision-job.zip --out-dir build/vision-30x8/output
          exit $LASTEXITCODE
      - name: Validate isolated Windows runtime without GTK or system Python
        shell: pwsh
        run: |
          $diagramPythonHome = python -c "import sys; print(sys.base_prefix)"
          python -m tools.diagram_pipeline.build_runtime --python-home $diagramPythonHome --out-dir build/diagram-runtime/ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m tools.diagram_pipeline.verify_runtime --bundle build/diagram-runtime/ci --out-dir build/diagram-pipeline/portable-ci
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-diagram-pipeline
          path: |
            build/vision-demo/output/output-import-v2.zip
            build/vision-demo/output/prepared/adapter-report.json
            build/vision-30x8/input/analysis.json
            build/vision-30x8/input/source.png
            build/vision-30x8/output/output-import-v2.zip
            build/vision-30x8/output/prepared/adapter-report.json
            build/vision-demo/output/rendered/assets/
            build/diagram-pipeline/ci/import-v2.zip
            build/diagram-pipeline/ci/rendered/manifest.json
            build/diagram-pipeline/ci/rendered/assets/
            build/diagram-pipeline/portable-ci/verification-report.json
            build/diagram-pipeline/portable-ci/import-v2.zip
            build/diagram-pipeline/portable-ci/rendered/assets/
          if-no-files-found: ignore
  frontend:
    name: Frontend check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Debug marker check
        run: npm run check:debug

      - name: MCP and Tauri command contract checks
        run: npm run check:mcp-contract && npm run check:tauri-contract

      - name: Version consistency
        run: npm run version:check

      - name: Startup contract tests
        run: npm run test:startup

      - name: CSS ownership contract
        run: npm run test:css-ownership

      - name: Release contract
        run: npm run test:release-contract

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke
    needs: diagrams
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download generated synthetic CLI package
        uses: actions/download-artifact@v4
        with:
          name: synthetic-diagram-pipeline
          path: build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-runtime-ui-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features --message-format=short

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

  tauri-build:
    name: Tauri compile smoke
    needs: frontend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Tauri compile smoke
        run: npm run tauri -- build --no-bundle
